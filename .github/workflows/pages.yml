# Publica el sitio en GitHub Pages cada vez que cambia la rama principal (gratis, sin vencimiento).
# Requiere: Settings → Pages → Source: "GitHub Actions".
name: Publicar en GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci && npm test && npm run build
      - run: mkdir _site && cp -r index.html manifest.webmanifest sw.js marca .nojekyll _site/
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: d
        uses: actions/deploy-pages@v4
